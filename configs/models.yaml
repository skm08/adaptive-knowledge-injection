################################################################################
# Adaptive Knowledge Injection
# Model Configuration
#
# Ownership:
#   - generator LLM
#   - quantization
#   - text generation
#   - inference batch size
################################################################################

device: auto
torch_dtype: auto

generator:
  model: meta-llama/Llama-3.1-8B-Instruct
  provider: huggingface
  trust_remote_code: false
  max_context_length: 8192
  use_flash_attention: true

quantization:
  enabled: true
  method: 4bit
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

generation:
  max_new_tokens: 256
  min_new_tokens: 1
  temperature: 0.1
  top_p: 0.95
  top_k: 50
  repetition_penalty: 1.1
  do_sample: false

batch:
  inference_batch_size: 4

checkpoint:
  save_adapter_only: true
  save_tokenizer: true
  save_config: true

logging:
  log_model_summary: true
  log_trainable_parameters: true

future:
  enable_multi_llm: false
  enable_model_ensemble: false
  enable_moe: false
