################################################################################
# Adaptive Knowledge Injection
# Retrieval Configuration
#
# Purpose:
# Centralized configuration for all retrieval components.
#
# Covers:
#   - Chunking
#   - Dense Retrieval
#   - Sparse Retrieval (BM25)
#   - Hybrid Retrieval
#   - Vector Database
#   - Reranking
#   - Retrieval Evaluation
#
################################################################################

################################################################################
# General
################################################################################

seed: 42

device: auto

################################################################################
# Chunking
################################################################################

chunking:

  enabled: true

  strategy: recursive

  chunk_size: 512

  chunk_overlap: 128

  separators:

    - "\n\n"
    - "\n"
    - ". "
    - " "

  keep_separator: false

################################################################################
# Embedding
################################################################################

embedding:

  model: BAAI/bge-base-en-v1.5

  normalize_embeddings: true

  batch_size: 64

################################################################################
# Sparse Retrieval (BM25)
################################################################################

bm25:

  enabled: true

  k1: 1.5

  b: 0.75

################################################################################
# Dense Retrieval
################################################################################

dense:

  enabled: true

  similarity: cosine

################################################################################
# Hybrid Retrieval
################################################################################

hybrid:

  enabled: true

  strategy: weighted_sum

  bm25_weight: 0.40

  dense_weight: 0.60

################################################################################
# Vector Store
################################################################################

vector_store:

  backend: faiss

  index_type: IndexFlatIP

  save_index: true

  load_existing_index: true

################################################################################
# Retriever
################################################################################

retriever:

  top_k: 5

  fetch_k: 20

  return_scores: true

################################################################################
# Reranking
################################################################################

reranker:

  enabled: true

  model: BAAI/bge-reranker-base

  top_k: 5

################################################################################
# Retrieval-Augmented Generation
################################################################################

rag:

  inject_context: true

  max_context_passages: 5

  concatenate_strategy: sequential

################################################################################
# Metadata
################################################################################

metadata:

  include_dataset_name: true

  include_document_id: true

  include_chunk_id: true

  include_score: true

################################################################################
# Index Management
################################################################################

index:

  rebuild: false

  save_path: checkpoints/vector_store

################################################################################
# Logging
################################################################################

logging:

  save_retrieved_documents: true

  save_retrieval_scores: true

################################################################################
# Retrieval Evaluation
################################################################################

evaluation:

  recall_at:

    - 1
    - 3
    - 5
    - 10

  mrr: true

  map: true

  ndcg: true