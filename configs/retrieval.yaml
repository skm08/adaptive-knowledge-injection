################################################################################
# Adaptive Knowledge Injection
# Retrieval Configuration
#
# Ownership:
#   - chunking strategy
#   - embedding model
#   - reranker model
#   - vector store
#   - retriever top-k/fetch-k
################################################################################

device: auto

chunking:
  enabled: true
  strategy: recursive
  chunk_size: 512
  chunk_overlap: 128
  separators:
    - "\n\n"
    - "\n"
    - ". "
    - " "
  keep_separator: false

embedding:
  model: BAAI/bge-base-en-v1.5
  provider: huggingface
  dimension: 768
  normalize_embeddings: true
  batch_size: 64

bm25:
  enabled: true
  k1: 1.5
  b: 0.75

dense:
  enabled: true
  similarity: cosine

hybrid:
  enabled: true
  strategy: weighted_sum
  bm25_weight: 0.40
  dense_weight: 0.60

vector_store:
  backend: faiss
  index_type: IndexFlatIP
  save_index: true
  load_existing_index: true

retriever:
  top_k: 5
  fetch_k: 20
  return_scores: true

reranker:
  enabled: true
  model: BAAI/bge-reranker-base
  provider: huggingface
  top_k: 5

rag:
  inject_context: true
  max_context_passages: 5
  concatenate_strategy: sequential

metadata:
  include_dataset_name: true
  include_document_id: true
  include_chunk_id: true
  include_score: true

index:
  rebuild: false
  save_path: checkpoints/vector_store

logging:
  save_retrieved_documents: true
  save_retrieval_scores: true

evaluation:
  recall_at:
    - 1
    - 3
    - 5
    - 10
  mrr: true
  map: true
  ndcg: true
