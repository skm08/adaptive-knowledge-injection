################################################################################
# Adaptive Knowledge Injection
# Evaluation Configuration
#
# Ownership:
#   - task metrics
#   - retrieval metrics
#   - hallucination metrics
#   - efficiency metrics
#   - statistical significance settings
################################################################################

save_predictions: true
save_metrics: true
save_reports: true

tasks:
  question_answering: true
  summarization: true

question_answering:
  metrics:
    - exact_match
    - f1
    - bertscore

summarization:
  metrics:
    - rouge1
    - rouge2
    - rougeL
    - bleu
    - bertscore

retrieval:
  enabled: true
  metrics:
    - recall@1
    - recall@3
    - recall@5
    - recall@10
    - mrr
    - map
    - ndcg

hallucination:
  enabled: true
  metrics:
    - faithfulness
    - context_precision
    - context_recall

efficiency:
  enabled: true
  metrics:
    - inference_latency
    - throughput
    - gpu_memory
    - model_size

statistics:
  enabled: true
  significance_level: 0.05
  multiple_testing_correction: holm
  tests:
    paired_t_test: true
    wilcoxon_signed_rank: true
    bootstrap_confidence_interval: true
    mcnemar: false
  effect_size:
    cohens_d: true

confidence_interval:
  enabled: true
  confidence_level: 0.95
  bootstrap_samples: 1000

error_analysis:
  enabled: true
  save_failed_predictions: true
  max_examples: 200

cross_dataset:
  enabled: true

leaderboard:
  ranking_metric:
    question_answering: f1
    summarization: rougeL

visualization:
  confusion_matrix: false
  metric_bar_plot: true
  radar_plot: true
  box_plot: true
  learning_curve: true

output:
  save_tables: true
  save_figures: true
  save_json: true
  save_csv: true

logging:
  save_evaluation_log: true
  verbose: true
