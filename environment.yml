name: adaptive-knowledge-injection
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pytorch
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - pyarrow
  - pyyaml
  - faiss-cpu
  - tqdm
  - pip:
      - accelerate>=0.33.0
      - bitsandbytes>=0.43.3; platform_system != "Windows"
      - datasets>=2.20.0
      - evaluate>=0.4.2
      - huggingface-hub>=0.24.0
      - langchain>=0.2.11
      - langchain-text-splitters>=0.2.2
      - nltk>=3.8.1
      - peft>=0.12.0
      - rouge-score>=0.1.2
      - sacrebleu>=2.4.0
      - sentence-transformers>=3.0.0
      - tensorboard>=2.16.0
      - transformers>=4.43.0
